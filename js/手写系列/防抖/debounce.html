<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let btn = document.getElementById('btn')
        function handle(e){
            console.log("向后端发送请求")
        }
        btn.addEventListener('click',debounce(handle,1000))

        function debounce(fn,wait){
            var timer = null
            return function(e){
                clearTimeout(timer)
                timer = setTimeout(()=>{
                    fn(e)
                },wait)
            }
    }
    </script>
</body>
</html>
